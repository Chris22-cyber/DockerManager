name: Build & Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  APP_VERSION: '1.0.0'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DockerManager.sln

      - name: Build
        run: dotnet build DockerManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/DockerManager.Core.Tests/DockerManager.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/DockerManager.App/DockerManager.App.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.APP_VERSION }}
          -o publish

      - name: Upload exe (standalone)
        uses: actions/upload-artifact@v4
        with:
          name: DockerManager-Portable
          path: publish/

      - name: Build Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ env.APP_VERSION }} installer\setup.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DockerManager-Setup-${{ env.APP_VERSION }}
          path: output/DockerManager-Setup-*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: DockerManager-Setup-${{ env.APP_VERSION }}
          path: installer

      - name: Download portable
        uses: actions/download-artifact@v4
        with:
          name: DockerManager-Portable
          path: portable

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/DockerManager-Setup-*.exe
            portable/DockerManager.App.exe
          generate_release_notes: true
